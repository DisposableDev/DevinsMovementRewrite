name: Public source quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install source analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 build-essential
      - name: Check changed source with temporary frontend assets
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if [ -z "$QUALITY_BASE" ] || [ "$QUALITY_BASE" = "0000000000000000000000000000000000000000" ]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              QUALITY_BASE="$(git rev-parse HEAD^)"
              python3 tools/check_quality.py --base "$QUALITY_BASE" --frontend-only
            else
              python3 tools/check_first_import.py
            fi
          else
            python3 tools/check_quality.py --base "$QUALITY_BASE" --frontend-only
          fi
      - name: Check ROM-independent source tooling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 tests/test_public_source.py
          python3 tests/test_quality.py
          python3 tests/test_regression_runner.py
          python3 tests/run_regressions.py --check-case-catalog
